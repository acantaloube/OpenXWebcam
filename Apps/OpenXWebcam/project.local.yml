# Local build spec: builds ONLY the app, ad-hoc signed, with no bundled system
# extension. It drives the already-installed, maintainer-signed extension via
# CoreMediaIO, so no Developer ID and no SIP change are needed.
name: OpenXWebcam
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0-xt3"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: NO
packages:
  CameraEngine:
    path: ../../CameraEngine
targets:
  OpenXWebcam:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: CameraEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openxwebcam.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: OpenXWebcam feeds video from your Fujifilm camera into its virtual camera.
